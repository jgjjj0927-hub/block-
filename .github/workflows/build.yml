name: Build Driver and DLL

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install WDK
      run: |
        winget install --id Microsoft.WindowsWDK.10.0.22621 --accept-source-agreements --accept-package-agreements

    - name: Build Driver via MSBuild
      run: |
        # Ищем MSBuild в системе
        $msbuild = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
        if (!(Test-Path $msbuild)) {
            $msbuild = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe"
        }
        
        # Запускаем сборку драйвера
        & $msbuild blocker.vcxproj /p:Configuration=Release /p:Platform=x64

    - name: Build DLL (unlock)
      run: |
        cl /LD unlock.c /link /OUT:unlock.dll advapi32.lib

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: blocker-package
        path: |
          x64\Release\blocker.sys
          unlock.dll
          blocker.inf
